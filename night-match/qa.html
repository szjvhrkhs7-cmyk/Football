<!doctype html><html lang="ru"><meta charset="utf-8"><title>Ночной матч: проверка экранов</title><style>body{background:#142536;color:white;font:14px Arial;margin:18px}button{padding:10px;margin:0 5px 12px 0}iframe{display:block;border:1px solid #789;max-width:none}#status{margin:10px 0}</style><h1>Проверка мобильных размеров</h1><p>Встроенная игра использует реальный размер области просмотра. Синтетические события не заменяют проверку на физическом телефоне.</p><div id="sizes"><button data-size="844,390">844 × 390</button><button data-size="852,393">852 × 393</button><button data-size="932,430">932 × 430</button><button data-size="915,412">915 × 412</button><button data-size="393,852">Вертикально</button></div><button id="multi">Проверить движение + прыжок + удар</button><p id="status">Готово к проверке</p><iframe title="Мобильная игра" src="./" width="844" height="390"></iframe><script>
const f=document.querySelector('iframe'),status=document.getElementById('status');document.getElementById('sizes').onclick=e=>{if(!e.target.dataset.size)return;const [w,h]=e.target.dataset.size.split(',');f.width=w;f.height=h;status.textContent='Экран '+w+' × '+h;};
document.getElementById('multi').addEventListener('mousedown',e=>e.preventDefault());
document.getElementById('multi').onclick=async()=>{const doc=f.contentDocument,actions=['right','jump','kick'];const play=doc.getElementById('play');if(!doc.getElementById('overlay').hidden)play.click();status.textContent='Идёт отсчёт…';await new Promise(resolve=>setTimeout(resolve,3200));actions.forEach((name,i)=>{doc.querySelector('[data-control='+name+']').dispatchEvent(new PointerEvent('pointerdown',{pointerId:40+i,pointerType:'touch',bubbles:true,cancelable:true}));});const active=doc.querySelectorAll('.pressed').length;status.textContent=active===3?'PASS: одновременно нажаты 3 кнопки':'FAIL: матч ещё не активен';setTimeout(()=>{actions.forEach((name,i)=>doc.querySelector('[data-control='+name+']').dispatchEvent(new PointerEvent('pointerup',{pointerId:40+i,pointerType:'touch',bubbles:true})));if(active===3)status.textContent+='; отпускание: '+(doc.querySelectorAll('.pressed').length===0?'PASS':'FAIL');},300);};
</script></html>
