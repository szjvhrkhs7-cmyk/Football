name: Pulse regression checks
on:
  push:
    branches: [main]
    paths:
      - 'pulse/**'
      - '.github/workflows/pulse-checks.yml'
  pull_request:
    paths:
      - 'pulse/**'
      - '.github/workflows/pulse-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pulse/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
